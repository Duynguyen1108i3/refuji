<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="24" fill="#0E121B"/>
  <defs>
    <linearGradient id="carbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Ball Head -->
  <circle cx="200" cy="110" r="28" fill="#475569" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="175" y="65" width="50" height="20" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="185" y="55" width="30" height="10" rx="2" fill="#F59E0B"/>
  <!-- Canopy Hub -->
  <rect x="180" y="138" width="40" height="24" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.2)"/>
  <!-- Center Column -->
  <line x1="200" y1="162" x2="200" y2="280" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <!-- Leg 1 (Left) -->
  <line x1="185" y1="155" x2="110" y2="340" stroke="url(#carbonGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Leg 2 (Center/Back) -->
  <line x1="200" y1="160" x2="200" y2="345" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
  <!-- Leg 3 (Right) -->
  <line x1="215" y1="155" x2="290" y2="340" stroke="url(#carbonGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Rubber Feet -->
  <circle cx="110" cy="340" r="7" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="200" cy="345" r="7" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="290" cy="340" r="7" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Badge -->
  <text x="200" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#38BDF8" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PEAK DESIGN CARBON</text>
</svg>