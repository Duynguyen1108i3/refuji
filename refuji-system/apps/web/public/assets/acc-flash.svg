<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="24" fill="#0E121B"/>
  <!-- Hot Shoe Mount -->
  <rect x="180" y="330" width="40" height="18" rx="2" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="190" y="348" width="20" height="6" fill="#F59E0B"/>
  <!-- Flash Lower Body -->
  <rect x="150" y="210" width="100" height="120" rx="10" fill="#1E2330" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- LCD on Flash -->
  <rect x="165" y="225" width="70" height="45" rx="6" fill="#0A0D14" stroke="#38BDF8" stroke-width="1"/>
  <text x="200" y="245" font-family="monospace" font-size="10" fill="#38BDF8" font-weight="bold" text-anchor="middle">TTL  1/128</text>
  <text x="200" y="260" font-family="monospace" font-size="9" fill="#10B981" text-anchor="middle">CH1 • GrA</text>
  <!-- Navigation Dial -->
  <circle cx="200" cy="295" r="16" fill="#0F172A" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="200" cy="295" r="6" fill="#475569"/>
  <!-- Swivel Neck -->
  <rect x="165" y="175" width="70" height="35" rx="6" fill="#181E2C" stroke="rgba(255,255,255,0.15)"/>
  <!-- Round Flash Head (V1) -->
  <circle cx="200" cy="115" r="55" fill="#1E2330" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="200" cy="115" r="45" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="35" fill="#FFFFFF" fill-opacity="0.1" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Fresnel Ring Pattern -->
  <circle cx="200" cy="115" r="22" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="200" cy="115" r="10" fill="#FCD34D" fill-opacity="0.7"/>
  <!-- Brand Badge -->
  <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="1">GODOX V1F FOR FUJIFILM</text>
</svg>