<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="24" fill="#0E121B"/>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0F131C"/>
    </linearGradient>
    <linearGradient id="redBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <!-- SD Card Body -->
  <path d="M120 70 L260 70 L280 90 L280 320 L120 320 Z" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Write Protect Switch -->
  <rect x="114" y="110" width="6" height="18" rx="2" fill="#F59E0B"/>
  <!-- Header Stripe -->
  <rect x="120" y="85" width="160" height="45" fill="url(#redBadge)"/>
  <text x="200" y="115" font-family="system-ui, sans-serif" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle" letter-spacing="1">SanDisk</text>
  <!-- Label Content -->
  <text x="200" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#E2E8F0" font-weight="bold" text-anchor="middle">Extreme PRO</text>
  <text x="200" y="200" font-family="system-ui, sans-serif" font-size="28" fill="#FFFFFF" font-weight="900" text-anchor="middle">128 GB</text>
  <!-- Speed & Specs -->
  <rect x="145" y="225" width="110" height="26" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="200" y="243" font-family="monospace" font-size="12" fill="#38BDF8" font-weight="bold" text-anchor="middle">300 MB/s</text>
  <text x="200" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#FCD34D" font-weight="bold" text-anchor="middle">SDXC II  •  V90  •  U3</text>
</svg>