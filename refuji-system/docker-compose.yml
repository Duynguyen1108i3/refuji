services:
  mysql:
    image: mysql:8.4
    container_name: refuji_mysql84
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RefujiRoot@2026}
      MYSQL_DATABASE: ${DB_NAME:-refuji_db}
      MYSQL_USER: ${DB_USER:-refuji_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-RefujiPass@2026}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-lock-wait-timeout=15
    volumes:
      - refuji_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: refuji_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Giao diện Web xem email test nhắc lịch trả máy / quên mật khẩu
      - "1025:1025" # Cổng SMTP local

volumes:
  refuji_mysql_data:
