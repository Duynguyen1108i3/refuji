<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="24" fill="#0E121B"/>
  <defs>
    <linearGradient id="battGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242B38"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Dual Charger Base -->
  <rect x="70" y="190" width="260" height="130" rx="16" fill="#181E2C" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- LCD Display Screen -->
  <rect x="110" y="225" width="180" height="60" rx="8" fill="#0A0D14" stroke="#10B981" stroke-width="1.2"/>
  <text x="130" y="250" font-family="monospace" font-size="12" fill="#10B981" font-weight="bold">CH1: 100% [8.4V]</text>
  <text x="130" y="272" font-family="monospace" font-size="12" fill="#10B981" font-weight="bold">CH2:  98% [8.3V]</text>
  <!-- Battery Slot 1 (NP-W235) -->
  <rect x="95" y="80" width="95" height="135" rx="8" fill="url(#battGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="105" y="72" width="20" height="8" rx="2" fill="url(#goldPin)"/>
  <rect x="165" y="72" width="20" height="8" rx="2" fill="url(#goldPin)"/>
  <text x="142" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="1">FUJIFILM</text>
  <text x="142" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">NP-W235 2200mAh</text>
  <!-- Battery Slot 2 (NP-W235) -->
  <rect x="210" y="80" width="95" height="135" rx="8" fill="url(#battGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="220" y="72" width="20" height="8" rx="2" fill="url(#goldPin)"/>
  <rect x="280" y="72" width="20" height="8" rx="2" fill="url(#goldPin)"/>
  <text x="257" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="1">FUJIFILM</text>
  <text x="257" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">NP-W235 2200mAh</text>
</svg>